
<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WHIMSY WORLD</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;
  background:
    radial-gradient(ellipse at 50% 35%, #671c24 0%, #300e14 45%, #10090b 100%);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px 22px;
  overflow-x: hidden;
}

.container {
  width: 100%;
  max-width: 390px;
  text-align: center;
}

.logo {
  width: 230px;
  max-width: 75%;
  height: auto;
  object-fit: contain;
  margin: 0 auto 5px;
  display: block;
}

.character {
  width: 220px;
  max-width: 75%;
  height: 220px;
  object-fit: contain;
  display: block;
  margin: 0 auto 12px;
  filter: drop-shadow(0 15px 22px #0008);
}

h2 {
  font-size: 23px;
  letter-spacing: 3px;
  margin: 10px 0;
}

.description {
  color: #e3c6c8;
  font-size: 14px;
  margin-bottom: 30px;
  line-height: 2;
}

.button {
  display: flex;
  justify-content: center;
  align-items: center;
  width: 100%;
  padding: 17px;
  margin: 15px 0;
  border-radius: 16px;
  text-decoration: none;
  color: white;
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1.5px;
  transition: .2s;
  box-shadow: 0 8px 22px #0005;
}

.telegram {
  background: linear-gradient(135deg, #36b8ed, #1475ad);
}

.rubika {
  background: linear-gradient(135deg, #fa4652, #b91429);
}

.button:active {
  transform: scale(.96);
}

.footer {
  color: #bd969a;
  font-size: 11px;
  margin-top: 35px;
  letter-spacing: 3px;
}
</style>
</head>

<body>
<div class="container">

  <img
    src="grok_1793711862000.jpg"
    class="logo"
    alt="WHIMSY">

  <img
    src="1794414712086.png"
    class="character"
    alt="Whimsy">

  <h2>WELCOME TO WHIMSY</h2>

  <div class="description">
    برای ارتباط با ما، یکی از راه‌های زیر را انتخاب کنید
  </div>

  <a class="button telegram"
     href="https://t.me/WHIMSY_WORLD"
     target="_blank">
    TELEGRAM
  </a>

  <a class="button rubika"
     href="https://rubika.ir/WHIMSY_WORLD"
     target="_blank">
    RUBIKA
  </a>

  <div class="footer">WHIMSY WORLD</div>

</div>
</body>
</html>
